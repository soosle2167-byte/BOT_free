name: Run Telegram Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: telegram-bot-instance
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Checkout Public Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Libraries
        run: |
          pip install pyrogram tgcrypto telethon python-dotenv requests

      - name: Pull Data & Secrets from Private Repo
        run: |
          # سحب البيانات الحساسة وجلسات التيليجرام من المستودع الخاص
          git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/soosle2167-byte/bot-data.git temp_data
          cp -rf temp_data/* .
          cp -f temp_data/.env . 2>/dev/null || true

          # التأكد التلقائي من وجود main.py في المسار الرئيسي
          if [ ! -f main.py ]; then
            FOUND_FILE=$(find . -maxdepth 3 -name "main.py" -not -path "./temp_data/*" | head -n 1)
            if [ -n "$FOUND_FILE" ]; then
              echo "Moving $FOUND_FILE to root main.py"
              cp -f "$FOUND_FILE" ./main.py
            fi
          fi

      - name: Run Bot Silently & Auto-Sync
        run: |
          if [ ! -f main.py ]; then
            echo "❌ خطأ: ملف main.py غير موجود في الصفحة الرئيسية للريبو!"
            echo "الملفات الموجودة حالياً:"
            ls -la
            exit 1
          fi

          # مزامنة دورية في الخلفية كل 150 ثانية لحفظ أي روابط مستخدمة أو إشعارات جديدة في الريبو الخاص
          (
            while true; do
              sleep 150
              rm -f temp_data/*.json temp_data/*.session temp_data/.git/index.lock
              cp -f *.json *.session temp_data/ 2>/dev/null || true
              (
                cd temp_data
                git config user.name "Bot Sync"
                git config user.email "bot@noreply.github.com"
                git add -A
                if ! git diff --cached --quiet; then
                  git commit -m "Auto-sync bot data [skip ci]"
                  git push || true
                fi
              )
            done
          ) &
          SYNC_PID=$!
          set +e
          # تشغيل البوت لمدة 340 دقيقة (أقل من الحد الأقصى لـ GitHub Actions بـ 20 دقيقة)
          timeout 340m python -u main.py
          echo $? > bot_exit_code.txt
          kill $SYNC_PID 2>/dev/null || true

      - name: Save Data & Trigger Next Session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # حفظ البيانات النهائي قبل إغلاق الحاوية
          rm -f temp_data/*.json temp_data/*.session temp_data/.git/index.lock
          cp -f *.json *.session temp_data/ 2>/dev/null || true
          cd temp_data
          git config user.name "Bot Sync"
          git config user.email "bot@noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Final update bot data [skip ci]"
            git push || true
          fi
          cd ..
          
          # إعادة تشغيل دورة العمل التالية تلقائياً لضمان العمل 24/7
          EXIT_CODE=$(cat bot_exit_code.txt 2>/dev/null || echo "1")
          if [ "$EXIT_CODE" -eq 124 ] || [ "$EXIT_CODE" -eq 0 ]; then
            gh workflow run run.yml --repo ${{ github.repository }}
          fi
